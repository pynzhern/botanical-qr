<html lang="en">
<head>

  <!-- fonts: the same Garamond and Inter families and weights as pynzhern.com, non-blocking; fallbacks below if offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <style>
    /* metric matched stand-ins, as on the portfolio: text sets in a scaled local face until the web fonts arrive */
    @font-face { font-family: 'Inter Fallback'; font-weight: 400; src: local('Arial'); size-adjust: 106.7%; ascent-override: 90.8%; descent-override: 22.6%; line-gap-override: 0%; }
    @font-face { font-family: 'Inter Fallback'; font-weight: 500; src: local('Arial'); size-adjust: 107.9%; ascent-override: 89.8%; descent-override: 22.3%; line-gap-override: 0%; }
    @font-face { font-family: 'EB Garamond Fallback'; font-style: normal; font-weight: 400; src: local('Georgia'); size-adjust: 84.5%; ascent-override: 119.2%; descent-override: 35.3%; line-gap-override: 0%; }
    @font-face { font-family: 'EB Garamond Fallback'; font-style: italic; font-weight: 400; src: local('Georgia Italic'), local('Georgia-Italic'); size-adjust: 81.6%; ascent-override: 123.4%; descent-override: 36.5%; line-gap-override: 0%; }

    :root {
      --surface: #f7f7f6;
      --ink: #111111; --ink-2: rgba(17,17,17,0.74); --ink-3: rgba(17,17,17,0.6); --rule: rgba(17,17,17,0.12);
      --font-body: 'Inter', 'Inter Fallback', -apple-system, system-ui, sans-serif;
      --font-serif: 'EB Garamond', 'EB Garamond Fallback', Georgia, serif;
      --label-size: 10.5px; --label-track: 0.12em;
      --gutter: clamp(16px, 4vw, 56px);
      --footer-h: calc(56px + env(safe-area-inset-bottom, 0px));
      --strip-h: 56px;                     /* written by the page script: the measured height of the bottom strip */
      --dur: 675ms;
      /* the portfolio's single spring (period 0.5s, no bounce), sampled as css linear() */
      --spring: linear(0, 0.158, 0.413, 0.626, 0.774, 0.868, 0.925, 0.958, 0.977, 0.987, 0.993, 0.996, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--surface); }
    body { font-family: var(--font-body); color: var(--ink); -webkit-font-smoothing: antialiased; }
    /* the canvas fills the window above the strip, so the plant centres in the room that is left */
    #app { position: fixed; left: 0; right: 0; top: 0; bottom: var(--strip-h); }
    canvas { display: block; touch-action: none; }
    button { -webkit-tap-highlight-color: transparent; }

    /* the one small-label style: Inter 500, capitals, tracked */
    .label, .menu button, #toggle, #saveBtn, #aboutBtn, .about .hint {
      font-family: var(--font-body); font-weight: 500; font-size: var(--label-size); line-height: 16px;
      letter-spacing: var(--label-track); text-transform: uppercase; }
    button { margin: 0; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; cursor: pointer;
      color: var(--ink-2); transition: color var(--dur) var(--spring); }
    button:hover, button[aria-expanded="true"] { color: var(--ink); }
    button:focus-visible, input:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
    button:focus:not(:focus-visible), input:focus:not(:focus-visible) { outline: none; }
    button:disabled { color: var(--ink-3); cursor: default; }

    .hud { position: fixed; left: 0; top: 0; right: 0; pointer-events: none;
      padding: max(22px, env(safe-area-inset-top)) max(var(--gutter), env(safe-area-inset-right)) 0 max(var(--gutter), env(safe-area-inset-left)); }

    /* name, about label, about text */
    .top { display: flex; flex-direction: column; align-items: flex-start; }
    .brand { pointer-events: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .mark { font-family: var(--font-serif); font-weight: 400; font-size: 20px; line-height: 1.1; letter-spacing: 0; color: var(--ink); }
    /* site-v4: about sits in the top right corner, away from the title; its text opens beneath it */
    #aboutBtn { position: fixed; z-index: 3; text-align: left; top: calc(max(22px, env(safe-area-inset-top)) + 8px);
      right: max(var(--gutter), env(safe-area-inset-right)); }
    #aboutBtn::before { content: ''; position: absolute; inset: -14px -10px -14px -4px; }
    /* site-v7: no box. on wide windows the text is set straight on the page, right aligned under its label, in a
       narrow column where the plant never reaches. on phones, where the plant fills the screen, it becomes a plain
       band of the page surface across the full width under the title, closed by one hairline */
    .about { --about-top: calc(max(22px, env(safe-area-inset-top)) + 44px);
      pointer-events: auto; position: fixed; top: var(--about-top); z-index: 4;
      right: max(var(--gutter), env(safe-area-inset-right)); width: 300px; text-align: right;
      max-height: calc(100vh - var(--about-top) - var(--strip-h) - 12px); overflow-y: auto; overscroll-behavior: contain;
      opacity: 0; visibility: hidden; transition: opacity var(--dur) var(--spring), visibility var(--dur); }
    @supports (height: 100dvh) { .about { max-height: calc(100dvh - var(--about-top) - var(--strip-h) - 12px); } }
    @media (max-width: 720px) {
      .about { left: 0; right: 0; width: auto; text-align: left; background: var(--surface);
        border-bottom: 1px solid var(--rule);
        padding: 14px max(var(--gutter), env(safe-area-inset-right)) 14px max(var(--gutter), env(safe-area-inset-left)); }
    }
    .about.open { opacity: 1; visibility: visible; }
    .about .lead { font-family: var(--font-serif); font-size: 20px; line-height: 1.25; color: var(--ink); margin: 0 0 8px; }
    .about p { font-size: 12.5px; line-height: 1.55; color: var(--ink-2); margin: 0 0 6px; }
    /* site-v8: the how-to is one quiet sentence in the body style, no capitals; the credit line is gone */
    .about .how { color: var(--ink-3); margin: 0; }
    .about .hint { color: var(--ink-3); margin: 0 0 3px; }
    .about .hint:last-child { margin: 10px 0 0; }
    @media (min-width: 721px) { .about .hint { white-space: nowrap; } }

    /* stacked pyn/zhern signature: ink, in the left margin at the middle of the room above the strip */
    .page-mark { position: fixed; left: var(--gutter); top: calc((100% - var(--strip-h)) / 2); transform: translateY(-50%);
      width: 52px; height: auto; pointer-events: none; user-select: none; z-index: 2; }
    @media (max-width: 720px), (max-height: 560px) { .page-mark { display: none; } }

    /* the strip: plain page surface across the bottom, words in a row */
    .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; pointer-events: auto;
      min-height: var(--footer-h); padding: 0 max(var(--gutter), env(safe-area-inset-right)) env(safe-area-inset-bottom, 0px) max(var(--gutter), env(safe-area-inset-left));
      background: var(--surface); display: flex; align-items: center; gap: 36px; }
    .seg { display: flex; gap: 22px; flex: none; }
    .seg button { font-family: var(--font-serif); font-size: 15px; line-height: 24px; letter-spacing: 0; text-transform: lowercase;
      white-space: nowrap; position: relative; }
    .seg button::before { content: ''; position: absolute; inset: -8px -4px; }
    .seg button.on { color: var(--ink); }
    .seg button:disabled { color: var(--ink-3); }
    .seg button.on:disabled { color: var(--ink); }

    input { font-family: var(--font-body); font-size: 12px; line-height: 20px; color: var(--ink); background: transparent; border: 0;
      border-bottom: 1px solid var(--rule); border-radius: 0; padding: 5px 0; flex: 1 1 200px; min-width: 120px; max-width: 320px; outline: none;
      -webkit-appearance: none; appearance: none; transition: border-color var(--dur) var(--spring); }
    input:hover, input:focus { border-bottom-color: var(--ink); }
    /* iOS Safari zooms inputs under 16px on focus; raise on touch devices only */
    @media (pointer: coarse) { input { font-size: 16px; } }
    input::placeholder { color: var(--ink-3); opacity: 1; }

    .actions { display: flex; align-items: center; gap: 28px; margin-left: auto; flex: none; }
    #toggle, #saveBtn { position: relative; white-space: nowrap; display: inline-flex; align-items: center; }
    /* site-v2: the two actions are line icons; their names live in aria-label and title */
    .ico { width: 18px; height: 18px; display: block; fill: none; stroke: currentColor; stroke-width: 1.25;
      stroke-linecap: round; stroke-linejoin: round; }
    #toggle .ico-grow, #toggle[data-state="flat"] .ico-flat { display: none; }
    #toggle[data-state="flat"] .ico-grow { display: block; }
    #toggle::before, #saveBtn::before { content: ''; position: absolute; inset: -14px -6px; }

    /* site-v3 save choices: no panel. the three formats appear as words in the strip, left of the save icon */
    .menu-wrap { display: flex; align-items: center; }
    .menu { order: -1; display: flex; align-items: center; gap: 20px; width: 0; overflow: hidden;
      opacity: 0; visibility: hidden; transition: opacity var(--dur) var(--spring), visibility var(--dur); }
    .menu.open { width: auto; overflow: visible; margin-right: 24px; opacity: 1; visibility: visible; }
    .menu button { position: relative; color: var(--ink-3); }
    .menu button:hover, .menu button:focus-visible { color: var(--ink); }
    .menu button::before { content: ''; position: absolute; inset: -14px -8px; }

    /* recording overlay: covers the frozen live view and shows the square loop being captured
       (the export canvas must be on-screen for Safari to capture its stream) */
    #recOverlay { position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; background: var(--surface); }
    #recOverlay.on { display: flex; }
    #recOverlay canvas { width: auto; height: 84vmin; max-width: 92vmin; }
    /* progress: a 1px ink line, no text */
    #recBar { width: clamp(200px, 40vmin, 340px); height: 1px; background: var(--rule); overflow: hidden; }
    #recBar > i { display: block; height: 100%; width: 0%; background: var(--ink); transition: width 0.18s linear; }
    /* indeterminate sweep while the gif encoder lib loads (before real progress starts) */
    #recBar.indet > i { width: 38%; transition: none; animation: recIndet 1.05s ease-in-out infinite; }
    @keyframes recIndet { 0% { margin-left: -38%; } 100% { margin-left: 100%; } }

    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
      font-family: var(--font-body); font-weight: 500; font-size: var(--label-size); letter-spacing: var(--label-track);
      text-transform: uppercase; color: var(--ink-2); transition: opacity 0.4s; }
    #loading.gone { opacity: 0; }

    /* narrower windows: the strip takes two rows, plant words first, the field and the two actions below */
    @media (max-width: 1060px) {
      .dock { flex-wrap: wrap; row-gap: 0; column-gap: 20px; padding-top: 4px; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
      .seg { flex: 1 0 100%; gap: 24px; overflow-x: auto; scrollbar-width: none; padding: 8px 4px; margin: 0 -4px; }
      .seg::-webkit-scrollbar { display: none; }
      .seg button { min-height: 44px; }
      input { min-height: 44px; flex: 1 1 120px; max-width: none; padding: 12px 0 8px; }
      .actions { gap: 4px; }
      #toggle, #saveBtn { min-height: 44px; padding: 0 10px; }
      #toggle::before, #saveBtn::before { inset: 0; }
      .menu { gap: 14px; }
      .menu.open { margin: 0 8px 0 10px; }
      .menu button { min-height: 44px; }
    }
    @media (max-width: 720px) {
      .mark { font-size: 18px; }
      .hud { padding-top: max(14px, env(safe-area-inset-top)); }
    }
    @media (prefers-reduced-motion: reduce) { button, input, .about, .menu { transition: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">growing…</div>
  <img id="pageMark" class="page-mark" alt="" aria-hidden="true" />
  <div class="hud">
    <div class="top">
      <div class="brand">
        <span class="mark">Botanical QR</span>
        <button id="aboutBtn" aria-expanded="false" aria-controls="aboutCard">about</button>
      </div>
      <div class="about" id="aboutCard" role="region" aria-label="about Botanical QR">
        <p class="lead">Scannable plants.</p>
        <p>The top-down view is a real, scannable QR code; tilt it and a 3D plant grows from the same pixels.</p>
        <p class="how">Drag to spin. Tap the plant to flatten or grow.</p>
      </div>
    </div>
  </div>
  <div class="dock" id="dock" role="group" aria-label="controls">
    <span class="seg" id="plantSeg" role="group" aria-label="choose plant">
      <button data-model="caladium-h" class="on" aria-pressed="true">caladium</button>
      <button data-model="frangipani" aria-pressed="false">frangipani</button>
      <button data-model="pitcher" aria-pressed="false">pitcher</button>
      <button data-model="pine" data-season="forest" aria-pressed="false">forest pine</button>
      <button data-model="pine" data-season="snow" aria-pressed="false">snow pine</button>
    </span>
    <input id="content" type="url" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="QR content URL" placeholder="https://your-link" />
    <div class="actions">
      <button id="toggle" data-state="grown" aria-label="flatten to QR" title="flatten to QR">
        <svg class="ico ico-flat" viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="2.5" width="5" height="5"/><rect x="10.5" y="2.5" width="5" height="5"/><rect x="2.5" y="10.5" width="5" height="5"/><path d="M10.5 10.5h2v2h-2zM15.5 10.5v2M13 15.5h2.5v-1M10.5 15.5v-.5"/></svg>
        <svg class="ico ico-grow" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2 15 5.5v7L9 16l-6-3.5v-7zM3 5.5 9 9l6-3.5M9 9v7"/></svg>
      </button>
      <div class="menu-wrap">
        <button id="saveBtn" aria-haspopup="true" aria-expanded="false" aria-label="save" title="save">
          <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2.5v9M5.5 8 9 11.5 12.5 8M3 15.5h12"/></svg>
        </button>
        <div class="menu" id="saveMenu" role="menu" aria-label="save as">
          <button data-act="png" role="menuitem" aria-label="save QR as PNG" title="save QR">PNG</button>
          <button data-act="mp4" role="menuitem" aria-label="save loop as video" title="save loop">video</button>
          <button data-act="gif" role="menuitem" aria-label="save loop as GIF" title="save loop">GIF</button>
        </div>
      </div>
    </div>
  </div>

  <div id="recOverlay"><div id="recBar"><i></i></div></div>

  <script type="importmap">
  { "imports": { "three": "https://esm.sh/three@0.160.0" } }
  </script>

  <script type="module">
    import * as THREE from 'three'
    import QRCode from 'https://esm.sh/qrcode@1.5.3'

    const CUBE = 1
    const DEFAULT_CONTENT = 'https://pynzhern.com'

    // ======================================================================
    // shared QR helper — only LUMINANCE is read by scanners, so any hue works
    // as a module as long as dark stays dark and light stays light.
    // ======================================================================
    function toMatrix(data) {
      const size = data.modules.size, matrix = []
      for (let y = 0; y < size; y++) { const row = []; for (let x = 0; x < size; x++) row.push(data.modules.get(x, y) === 1); matrix.push(row) }
      return matrix
    }
    function qrMatrix(content, opts) {
      let data
      try { data = QRCode.create(content || DEFAULT_CONTENT, opts) }
      catch (e) { data = QRCode.create(content || DEFAULT_CONTENT, { errorCorrectionLevel: opts.errorCorrectionLevel }) }
      return toMatrix(data)
    }
    // DEAD-ZONE SKIP: certain QR versions don't decode when a plant sits over the code centre — at some versions the
    // soft palette goes marginal at that module size (contrast dead-zones, e.g. v15/16/19), at others the canopy occludes
    // structure the error-correction can't recover (structural, e.g. v23). All are at 360+ char URLs. This picks the
    // smallest version ≥ minVer that FITS the content and is NOT a dead-zone — bypassing qrMatrix's auto-version fallback
    // (which silently lands on the bad version). Realistic URLs sit well below the first dead-zone, so they're untouched.
    function qrMatrixSafe(content, ec, minVer, deadSet) {
      const c = content || DEFAULT_CONTENT
      for (let v = minVer; v <= 40; v++) {
        if (deadSet.has(v)) continue
        try { return toMatrix(QRCode.create(c, { errorCorrectionLevel: ec, version: v })) } catch (e) { /* content overflows v → try the next */ }
      }
      return qrMatrix(c, { errorCorrectionLevel: ec }) // unreachable for any realistic length
    }

    // ======================================================================
    // CALADIUM — climbing golden-angle spiral of heart leaves. Every leaf cell
    // is coloured by the module beneath it: exposed tops carry the real QR, the
    // rest is a matching "mock" mottle so the whole plant reads as one variegated
    // thing. Leaves are scaled (never clipped) to fan out to the square edge.
    // ======================================================================
    const CAL = (() => {
      const CREAM = '#f3e7ea'
      const FLOOR_DARK = '#566159'
      const CREAM_C = new THREE.Color(CREAM)
      const FLOOR_DARK_C = new THREE.Color(FLOOR_DARK)
      const STALK_DARK = new THREE.Color('#587a3f')
      const GREEN_PALE = new THREE.Color('#d2e2cd')
      // unified variegation: midrib → blade → vein → green band → margin, on every leaf.
      // tuned for DECODE CONTRAST: every dark-module tone sits ≲90 luminance, every light-module tone ≳180, so the
      // binariser separates them cleanly even across the dense central rosette (deeper magenta veining reads as a
      // more vibrant caladium, not a decode liability).
      const ZD = { midrib: new THREE.Color('#7a2547'), blade: new THREE.Color('#94375a'), vein: new THREE.Color('#8a3f59'), gband: new THREE.Color('#45692f'), margin: new THREE.Color('#3a6630') } // dark module
      const ZL = { midrib: new THREE.Color('#e29cc0'), blade: new THREE.Color('#ecb6d0'), vein: new THREE.Color('#f3ddea'), gband: new THREE.Color('#c2dab2'), margin: new THREE.Color('#b3cda6') } // light module
      const ZN = { midrib: new THREE.Color('#9c3d63'), blade: new THREE.Color('#c9608a'), vein: new THREE.Color('#f3e6ec'), gband: new THREE.Color('#5f8f48'), margin: new THREE.Color('#3f6e34') } // occluded
      const POT_R = 8.5, POT_H = 11
      const POT_BODY = new THREE.Color('#c0744d')
      const POT_RIM = new THREE.Color('#d98f63')
      const POT_SOIL = new THREE.Color('#4f3b2a')
      const CAL_DEAD = new Set([15, 19, 23]) // QR versions that don't decode under the rosette (all at 360+ char URLs)

      function pseudoRandom(a, b, seed) { const s = Math.sin(a * 127.1 + b * 311.7 + seed * 43.7) * 43758.5; return s - Math.floor(s) }
      function frac(x) { return x - Math.floor(x) }
      function heart(u, v) { const x = u * 1.2, y = 1.2 - v * 2.4; const a = x * x + y * y - 1; return a * a * a - x * x * y * y * y <= 0 }
      function leafZone(u, v, e1, e2) {
        if (e1 || e2) return 'margin'
        const t = Math.abs(u)
        if (t < 0.07) return 'midrib'
        if (t > 0.8) return 'gband'  // pink blade reaches most of the leaf; slim green rim (was 0.68)
        if (frac(t * 4 - v * 1.6) < 0.09) return 'vein'
        return 'blade'
      }
      function pushCell(onOut, offOut, col, row, H, offset, zone, gridSize) {
        const onTile = col >= 0 && row >= 0 && col < gridSize && row < gridSize
        if (onTile) onOut.push({ col, row, H, zone })
        else offOut.push({ x: col - offset, y: H, z: row - offset, color: ZN[zone] })
      }
      function pushStalk(onOut, offOut, wx, wy, wz, matrix, offset, gridSize) {
        const col = Math.round(wx + offset), row = Math.round(wz + offset)
        const onTile = col >= 0 && row >= 0 && col < gridSize && row < gridSize
        if (onTile) onOut.push({ col, row, H: wy, color: matrix[row][col] ? STALK_DARK : GREEN_PALE, fixed: true })
        else offOut.push({ x: col - offset, y: wy, z: row - offset, color: GREEN_PALE })
      }
      function buildLeaf(onOut, offOut, leaf, matrix, offset, gridSize, potH) {
        const { cx, cz, az, size, baseH, rise, droop, cup } = leaf
        const ca = Math.cos(az), sa = Math.sin(az)
        const du = 1 / size, dv = 1 / (size * 1.7)
        const ext = Math.ceil(size * 2.4)
        const ccol = Math.round(cx + offset), crow = Math.round(cz + offset)
        let lmaxY = baseH
        const sSteps = Math.ceil(Math.hypot(cx, cz) + Math.abs(baseH - potH)) + 1
        for (let s = 0; s <= sSteps; s++) {
          const f = s / sSteps
          pushStalk(onOut, offOut, cx * f, potH + (baseH - potH) * f, cz * f, matrix, offset, gridSize)
        }
        for (let col = ccol - ext; col <= ccol + ext; col++) {
          for (let row = crow - ext; row <= crow + ext; row++) {
            const dx = (col - offset) - cx, dz = (row - offset) - cz
            const lz = dx * ca + dz * sa, lx = -dx * sa + dz * ca
            const u = lx / size, v = lz / (size * 1.7)
            if (v < 0 || v > 1 || u < -1 || u > 1) continue

        for (const c of cells) { const k = c.col + ',' + c.row; const cur = top.get(k); if (!cur || c.y > cur.y) top.set(k, c) }
        for (const c of cells) {
          const onTile = c.col >= 0 && c.row >= 0 && c.col < gridSize && c.row < gridSize
          const dark = onTile ? matrix[c.row][c.col] : false
          if (top.get(c.col + ',' + c.row) === c && onTile) {
            const pr2 = c.kind === 'throat' ? [THROAT_C, THROAT_C] : c.kind === 'peri' ? [PERI_L, PERI_D] : c.kind === 'lid' ? [LID_L, LID_D] : c.kind === 'wing' ? [WING_L, WING_D] : [PB_L, PB_D]
            matchedOut.push({ x: c.col - offset, y: c.y, z: c.row - offset, color: dark ? pr2[1] : pr2[0] })
          } else {
            const op = c.kind === 'throat' ? [THROAT_C, THROAT_C] : c.kind === 'peri' ? [PERI_L, PERI_D] : c.kind === 'lid' ? [LID_L, LID_D] : c.kind === 'wing' ? [WING_OL, WING_OD] : [PB_OL, PB_OD]
            solidOut.push({ x: c.col - offset, y: c.y, z: c.row - offset, color: onTile ? (dark ? op[1] : op[0]) : PB_OD })
          }
        }
      }
      // green tendril hanging the pitcher off a leaf tip (gentle curl). the TOP third is never culled so the
      // stalk visibly emerges from under the leaf tip = the pitcher reads as attached, not levitating.
      function buildTendril(matchedOut, solidOut, leafMap, ax, az0, ay, bx, bz, by, matrix, offset, gridSize) {
        const n = Math.max(4, Math.ceil(Math.hypot(bx - ax, by - ay, bz - az0)) * 2)
        const seen = new Set()
        for (let i = 0; i <= n; i++) {
          const t = i / n, curl = Math.sin(t * Math.PI) * 1.2
          const x = ax + (bx - ax) * t - curl, y = ay + (by - ay) * t, z = az0 + (bz - az0) * t + curl
          const col = Math.round(x + offset), row = Math.round(z + offset), yr = Math.round(y)
          if (t > 0.32 && !leafClear(leafMap, col, row, y)) continue   // keep the attachment run; cull only lower stretches that pierce a leaf
          // 2-cell-thick stalk (the cell + a neighbour toward the tip-curl side) so the connector reads at this scale
          for (const [oc, orr] of [[0, 0], [t < 0.5 ? 1 : 0, t < 0.5 ? 0 : 1]]) {
            const cc = col + oc, rr2 = row + orr, key = cc + ',' + rr2 + ',' + yr
            if (seen.has(key)) continue; seen.add(key)
            const onTile = cc >= 0 && rr2 >= 0 && cc < gridSize && rr2 < gridSize
            solidOut.push({ x: cc - offset, y: yr, z: rr2 - offset, color: onTile ? (matrix[rr2][cc] ? STK_D : STK_L) : STK_L })
          }
        }
      }
      function build(content) {
        const matrix = qrMatrixSafe(content, 'M', 9, PIT_DEAD)
        const gridSize = matrix.length, offset = (gridSize - 1) / 2, sc = gridSize / 33
        const groundCells = []
        for (let row = 0; row < gridSize; row++) for (let col = 0; col < gridSize; col++)
          groundCells.push({ x: col - offset, y: 0, z: row - offset, color: matrix[row][col] ? FLOOR_DARK_C : CREAM_C })
        let hsh = 2166136261 >>> 0
        for (let r = 0; r < gridSize; r++) for (let c = 0; c < gridSize; c++) { hsh ^= matrix[r][c] ? 1 : 0; hsh = (hsh * 16777619) >>> 0 }
        let rs = hsh || 1; const rnd = () => { rs = (rs * 1664525 + 1013904223) >>> 0; return rs / 4294967296 }
        const S = gridSize * 0.5 - 0.3
        const potR = 7.0 * sc, potH = Math.max(4, Math.round(10 * sc))   // adequately sized — a touch under frangipani's 7.5/11
        const potCells = []; buildPot(potCells, potR, potH)
        // rosette of strappy green leaves: few, distinct (golden angle), out + gently up, fit the square
        const leaves = [], overhang = [], tips = []
        const NL = 6 + Math.floor(rnd() * 2)
        const GOLDEN = 2.39996323, MAX_TILT = 1.7, climbMul = 1.0 + rnd() * 0.4
        let az = rnd() * Math.PI * 2
        const defs = []
        for (let k = 0; k < NL; k++) {
          az += GOLDEN + (rnd() - 0.5) * 0.4
          const t = NL > 1 ? k / (NL - 1) : 0
          defs.push({ az, rc: (1.6 + rnd() * 1.4) * sc, climbH: potH + (5 + t * 16 * climbMul + (rnd() - 0.5) * 2) * sc, size: (9 + t * 2 + rnd() * 2) * sc, rise: (8 + rnd() * 3) * sc, droop: (4 + rnd() * 2) * sc })
        }
        for (const d of defs) {
          const cA = Math.abs(Math.cos(d.az)), sA = Math.abs(Math.sin(d.az))
          const reach = d.rc + d.size * 2.2, lat = d.size * 0.8
          const f = Math.min(1.5, S / Math.max(reach * cA + lat * sA, reach * sA + lat * cA))
          const rc = d.rc * f, size = d.size * f
          tips.push(buildLeaf(leaves, overhang, { cx: Math.cos(d.az) * rc, cz: Math.sin(d.az) * rc, az: d.az, size, baseH: Math.max(d.climbH, potH + rc / MAX_TILT), rise: d.rise, droop: d.droop }, matrix, offset, gridSize))
        }
        const leafCells = [], leafMap = new Map()
        const mapLeaf = (col, row, H) => { const k = col + ',' + row; (leafMap.get(k) || leafMap.set(k, []).get(k)).push(H) }
        for (const v of leaves) {
          const onTile = v.col >= 0 && v.row >= 0 && v.col < gridSize && v.row < gridSize
          let color
          if (v.fixed) color = v.color
          else color = matrix[v.row][v.col] ? LD[v.zone] : LL[v.zone]
          leafCells.push({ x: v.col - offset, y: v.H, z: v.row - offset, color })
          mapLeaf(v.col, v.row, v.H)
        }
        // register the OFF-TILE overhang leaves too, so pitcher flaps de-intersect against the whole canopy (not just on-tile)
        for (const v of overhang) mapLeaf(Math.round(v.x + offset), Math.round(v.z + offset), v.y)
        const matched = [], solid = []
        const floorY = potH + 2 * sc                     // never sink into the soil
        // every leaf tip is a candidate, tallest first. the leaf-carve post-pass keeps pitchers solid through any leaf,
        // so a pitcher only needs to hang below its tip, inside the tile, above the soil — no canopy gymnastics.
        const allCand = tips.map((tp, i) => ({ tp, laz: defs[i].az, used: false })).sort((a, b) => b.tp.tipH - a.tp.tipH)
        let placed = 0; const want = 3 + Math.floor(rnd() * 2)   // target 3-4
        // hang one pitcher off candidate c if a cup of at least minPh fits; returns true on success.
        const place = (c, minPh) => {
          if (c.used) return false
          const { tp, laz } = c
          const pr0 = (2.8 + rnd() * 1.5) * sc
          const foot = pr0 + 2.6 * sc                    // lateral half-footprint (body + lid + wings)
          const rUse = Math.min(Math.hypot(tp.tx, tp.tz), S - foot)   // pull inward only enough to avoid overhang
          const px = Math.cos(laz) * rUse, pz = Math.sin(laz) * rUse
          const topExtra = 2.5 * sc + 0.93 * pr0         // neck + raised-lid rise above the cup top
          const topCap = tp.tipH - 5 * sc                // hang below the parent tip
          const phMax = topCap - floorY - topExtra
          if (phMax < minPh) return false
          const ph = Math.min(Math.round((13 + rnd() * 4) * sc), Math.floor(phMax))
          const pr = Math.min(pr0, 0.30 * ph)            // OBLONG (~2:1): clamp width to (possibly capped) height
          const baseY = Math.max(floorY, topCap - ph - topExtra)
          buildPitcher(matched, solid, leafMap, px, pz, baseY, ph, pr, laz, matrix, offset, gridSize)
          buildTendril(matched, solid, leafMap, tp.tx, tp.tz, tp.tipH, px - Math.cos(laz) * bodyR(pr, 1), pz - Math.sin(laz) * bodyR(pr, 1), baseY + ph, matrix, offset, gridSize)
          c.used = true; placed++; return true
        }
        // pass 1 — up to `want` nicely-sized pitchers off the outer tips
        for (const c of allCand) { if (placed >= want) break; if (Math.hypot(c.tp.tx, c.tp.tz) > S * 0.34) place(c, 7 * sc) }
        // GUARANTEE at least 2 — relax the height (then position) until two are hung
        for (const c of allCand) { if (placed >= 2) break; if (Math.hypot(c.tp.tx, c.tp.tz) > S * 0.30) place(c, 4 * sc) }
        for (const c of allCand) { if (placed >= 2) break; place(c, 2 * sc) }
        // LEAF-CARVE post-pass — the leaves de-intersect against the pitchers: any leaf cell sitting inside a pitcher's
        // vertical column (within its occupied y-range) is removed, so the solid pitcher reads in FRONT of the foliage
        // and no leaf slices through it. carve a 1-cell margin so the leaf stops just shy of the pitcher surface.
        const pitCol = new Map()   // "col,row" -> [minY, maxY] occupied by any pitcher cell
        for (const c of matched.concat(solid)) {
          const k = Math.round(c.x + offset) + ',' + Math.round(c.z + offset), r = pitCol.get(k)
          if (!r) pitCol.set(k, [c.y, c.y]); else { if (c.y < r[0]) r[0] = c.y; if (c.y > r[1]) r[1] = c.y }
        }
        const insidePitcher = (col, row, y) => { const r = pitCol.get(col + ',' + row); return r && y >= r[0] - 1 && y <= r[1] + 1 }
        const leafKept = leafCells.filter(c => !insidePitcher(Math.round(c.x + offset), Math.round(c.z + offset), c.y))
        const overhangKept = overhang.filter(c => !insidePitcher(Math.round(c.x + offset), Math.round(c.z + offset), c.y))
        let maxR = 0, maxY = 0
        for (const v of leaves) { const r = Math.hypot(v.col - offset, v.row - offset); if (r > maxR) maxR = r; if (v.H > maxY) maxY = v.H }
        for (const c of matched.concat(solid)) { const r = Math.hypot(c.x, c.z); if (r > maxR) maxR = r; if (c.y > maxY) maxY = c.y }
        if (potR > maxR) maxR = potR
        return {
          groups: [
            { cells: groundCells, fade: false, sway: false },
            { cells: potCells, fade: false, sway: false },
            { cells: solid, fade: false, sway: true },    // pitchers + tendrils sway WITH the plant (same pot-centre pivot → attachment holds)
            { cells: matched, fade: false, sway: true },
            { cells: leafKept, fade: false, sway: true },
            { cells: overhangKept, fade: true, sway: true }

          view: { span: gridSize, maxR, maxY, spanK: 0.6, radK: 0.84, heightK: 0.66, focusK: 0.46 }
        }
      }
      return { build }
    })()

    // ======================================================================
    // model registry
    // ======================================================================
    const MODELS = {
      'caladium-h': { accent: '#c24d77', bg: '#f7f1f3', grow: 'grow caladium', seasons: false, build: c => CAL.build(c, 'H') },
      'caladium-m': { accent: '#c24d77', bg: '#f7f1f3', grow: 'grow caladium', seasons: false, build: c => CAL.build(c, 'M') },
      'pine':       { accent: '#4a7c4e', bg: '#f2f5f2', grow: 'grow pine',     seasons: true,  build: (c, v) => PINE.build(c, v) },
      'frangipani': { accent: '#c98a2e', bg: '#f6f2ea', grow: 'grow frangipani', seasons: false, build: c => FRANGI.build(c) },
      'pitcher':    { accent: '#7a8f3a', bg: '#f1f3ec', grow: 'grow pitcher', seasons: false, build: c => PITCHER.build(c) }
    }

    // ======================================================================
    // scene — one renderer / camera / loop for every model
    // ======================================================================
    const app = document.getElementById('app')
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
    renderer.setSize(window.innerWidth, Math.max(1, window.innerHeight - 56))
    renderer.outputColorSpace = THREE.SRGBColorSpace
    app.appendChild(renderer.domElement)

    const scene = new THREE.Scene()
    scene.background = new THREE.Color(MODELS['caladium-h'].bg)
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 8000) // ortho keeps lifted voxels on their footprint top-down
    scene.add(new THREE.HemisphereLight(0xffffff, 0xa6a8a6, 1.02))
    const sun = new THREE.DirectionalLight(0xffffff, 1.18)
    sun.position.set(-11, 29, 11)
    scene.add(sun)

    const cubeGeo = new THREE.BoxGeometry(CUBE, CUBE, CUBE)
    const solidMat = new THREE.MeshStandardMaterial({ roughness: 0.88, flatShading: true })          // ground + the plant body (the QR)
    const fadeMat = new THREE.MeshStandardMaterial({ roughness: 0.9, flatShading: true, transparent: true, opacity: 1 }) // pot/trunk/overhang — fade when flat
    const obj = new THREE.Object3D()

    let meshes = []          // { mesh, sway }
    let view = null
    let currentModel = 'caladium-h'
    let variant = 'forest'

    function makeMesh(cells, mat) {
      const mesh = new THREE.InstancedMesh(cubeGeo, mat, cells.length)
      for (let i = 0; i < cells.length; i++) {
        const b = cells[i]
        obj.position.set(b.x, b.y + CUBE / 2, b.z)
        obj.updateMatrix(); mesh.setMatrixAt(i, obj.matrix)
        mesh.setColorAt(i, b.color)
      }
      mesh.instanceMatrix.needsUpdate = true
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true
      return mesh
    }

    function rebuild() {
      const data = MODELS[currentModel].build(input.value || DEFAULT_CONTENT, variant)
      view = data.view
      for (const m of meshes) { scene.remove(m.mesh); m.mesh.dispose() }
      meshes = []
      for (const g of data.groups) {
        if (!g.cells.length) continue
        const mesh = makeMesh(g.cells, g.fade ? fadeMat : solidMat)
        scene.add(mesh); meshes.push({ mesh, sway: g.sway })
      }
    }

    // ---- camera: flat ↔ iso morph + drag orbit ----------------------------
    let t = 0, target = 1
    let az = 0.7, el = 0.61
    // site-v6 test hook, inert in normal use: ?az=<rad>&el=<rad> sets the starting orbit once at start-up (nothing else reads them)
    { const q = new URLSearchParams(location.search), qa = parseFloat(q.get('az')), qe = parseFloat(q.get('el'))
      if (isFinite(qa)) az = qa
      if (isFinite(qe)) el = Math.max(0.2, Math.min(Math.PI / 2, qe)) }
    let exporting = false
    let topInset = 0, viewW = window.innerWidth, viewH = Math.max(1, window.innerHeight - 56) // live canvas size: the window above the bottom strip
    const pos = new THREE.Vector3(), tgt = new THREE.Vector3(), dir = new THREE.Vector3(), up = new THREE.Vector3(), upTop = new THREE.Vector3()
    const UP_FLAT = new THREE.Vector3(0, 0, -1), UP_ISO = new THREE.Vector3(0, 1, 0)
    function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2 }
    function fadeOpacity(e) { return 1 } // top-down is an honest projection of the 3D: pot/trunk/overhang always present, no fade/morph

    // place an ortho camera for a grow amount e (0 flat → 1 iso), azimuth and viewport aspect.
    // shared by the live loop and the export renderer so what you record matches what you see (except the v5 overhead framing, which is live only).
    // site-v6: how far the view is into straight overhead, 0 (orbiting, el 1.2 rad or lower) to 1 (el 1.55 rad, one degree short
    // of the top). it drives only the sway fade and the zoom-out guard below, never the scale of the plant itself.
    function overheadK(e) {
      const k = Math.max(0, Math.min(1, (el - 1.2) / 0.35)) // from the resting orbit, so grow and flatten keep the v4 motion
      return e * k * k * (3 - 2 * k)
    }
    // live = true only for the on-screen camera; the exports keep the v4 framing, so their frames do not change.
    function applyCamera(cam, e, azv, aspect, live) {
      const span = view.span
      // +4 modules of quiet zone on the tight axis so coarse (level-M) codes still anchor their finders
      const flatHalf = Math.max(span * 0.5 + 4, span / (2 * aspect)) * 1.06
      const isoHalf = Math.max(span * view.spanK, view.maxR * view.radK, view.maxY * view.heightK) * 1.1
      let halfH = flatHalf + (isoHalf - flatHalf) * e
      if (live) {
        // site-v6: the plant keeps its size on screen all the way to straight overhead. the one exception is a view where the
        // code with the flat view's fit (4 modules of quiet zone on the tight axis, 6% margin), turned to the current azimuth (reach |cos| + |sin| times its side), would run past
        // the canvas: the frame then zooms OUT just enough to hold it, easing in with elevation (el 1.2 to 1.55 rad). never zooms in.
        const f = Math.abs(Math.cos(azv * e)) + Math.abs(Math.sin(azv * e))
        const need = Math.max((span * 0.5 + 4) * f, span * f / (2 * aspect)) * 1.06 // the flat view's own fit, turned by f
        halfH += Math.max(0, need - halfH) * overheadK(e)
      }
      cam.top = halfH; cam.bottom = -halfH; cam.left = -halfH * aspect; cam.right = halfH * aspect
      cam.updateProjectionMatrix()
      const elNow = (Math.PI / 2) * (1 - e) + el * e
      const azNow = azv * e
      dir.set(Math.cos(elNow) * Math.sin(azNow), Math.sin(elNow), Math.cos(elNow) * Math.cos(azNow))
      up.copy(UP_FLAT).lerp(UP_ISO, e).normalize()
      // site-v4: the drag reaches straight overhead. there the world up is parallel to the view, so near the top
      // the camera's own orbit up takes over (the same picture below 1.2 rad, where nothing changes)
      const kTop = e * Math.max(0, Math.min(1, (elNow - 1.2) / (Math.PI / 2 - 1.2)))
      if (kTop > 0) {
        upTop.set(-Math.sin(elNow) * Math.sin(azNow), Math.cos(elNow), -Math.sin(elNow) * Math.cos(azNow))
        up.lerp(upTop, kTop).normalize()
      }
      tgt.set(0, view.maxY * view.focusK * e, 0)
      pos.copy(dir).multiplyScalar(span * 6).add(tgt)
      cam.position.copy(pos); cam.up.copy(up); cam.lookAt(tgt)
    }

    function frame(now) {
      if (exporting) { requestAnimationFrame(frame); return } // export drives the scene; pause the live loop
      t += (target - t) * 0.10
      if (Math.abs(target - t) < 0.0004) t = target
      const e = easeInOut(t)
      applyCamera(camera, e, az, viewW / (viewH - topInset), true)
      if (topInset) { // phones: fit the plant in the room below the title block, canvas stays full height (frustum scaled and shifted)
        const k = viewH / (viewH - topInset), d = topInset * camera.top / (viewH - topInset)
        camera.top = camera.top * k + d; camera.bottom = camera.bottom * k + d
        // site-v6: left and right stay at halfH * aspect (aspect already uses the room below the title), so a square draws square
        camera.updateProjectionMatrix()
      }
      // fade material fades to nothing when flat → clean square QR; sway × e → 0 at rest so the match holds
      fadeMat.opacity = fadeOpacity(e)
      const tm = now / 1000
      // site-v6: the sway shears the plant sideways, which smears the code; it fades out over el 1.2 to 1.55 rad (smoothstep), zero at the top
      const sw = e * (1 - overheadK(e))
      const sz = Math.sin(tm * 1.0) * 0.012 * sw, sx = Math.cos(tm * 0.8) * 0.008 * sw
      for (const m of meshes) if (m.sway) { m.mesh.rotation.z = sz; m.mesh.rotation.x = sx }
      renderer.render(scene, camera)
      requestAnimationFrame(frame)
    }

    // ---- interaction ------------------------------------------------------
    const btn = document.getElementById('toggle')
    const input = document.getElementById('content')
    const plantSeg = document.getElementById('plantSeg')
    const loading = document.getElementById('loading')
    input.value = DEFAULT_CONTENT

    // the toggle is an icon: its name goes to aria-label and title, its state picks the icon
    function nameToggle(m) {
      const name = target === 1 ? 'flatten to QR' : m.grow
      btn.dataset.state = target === 1 ? 'grown' : 'flat'
      btn.setAttribute('aria-label', name); btn.title = name
    }
    function toggle() {
      target = target === 0 ? 1 : 0
      if (target === 0) az = Math.atan2(Math.sin(az), Math.cos(az)) // un-spin the shortest way back to top-down
      nameToggle(MODELS[currentModel])
    }
    btn.addEventListener('click', toggle)

    let dragging = false, lastX = 0, lastY = 0, moved = 0
    const cv = renderer.domElement
    cv.addEventListener('pointerdown', ev => { dragging = true; lastX = ev.clientX; lastY = ev.clientY; moved = 0; cv.setPointerCapture(ev.pointerId) })
    cv.addEventListener('pointermove', ev => {
      if (!dragging) return
      const dx = ev.clientX - lastX, dy = ev.clientY - lastY
      lastX = ev.clientX; lastY = ev.clientY; moved += Math.abs(dx) + Math.abs(dy)
      az -= dx * 0.006
      el = Math.max(0.2, Math.min(Math.PI / 2, el + dy * 0.005))
    })
    cv.addEventListener('pointerup', () => {
      if (!dragging) return
      dragging = false
      if (moved < 6) { toggle(); return }
    })

    function applyTheme(m) {
      // site-v1: the interface is one fixed grey (--surface), so --accent, --bg and theme-color are no longer written.
      // scene.background is the scene's own ground: the exports render the same scene, so their quiet zone and footer
      // colour come from it. it stays per plant, exactly as in botanical-qr.html.
      scene.background.set(m.bg)
    }

    // one row, four presets: caladium fine/bold (error-correction H/M) and pine forest/snow.
    // each button carries its model and (for pine) its season; season is irrelevant to caladium.
    plantSeg.addEventListener('click', ev => {
      const b = ev.target.closest('button'); if (!b) return
      currentModel = b.dataset.model
      if (b.dataset.season) variant = b.dataset.season
      const m = MODELS[currentModel]
      plantSeg.querySelectorAll('button').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on) })
      applyTheme(m)
      nameToggle(m)
      rebuild()
    })

    // ---- export: a scannable still + a top-down → grow → orbit → flatten loop ----
    const saveBtn = document.getElementById('saveBtn')
    const saveMenu = document.getElementById('saveMenu')
    const recOverlay = document.getElementById('recOverlay')
    const recBar = document.getElementById('recBar')
    const recFill = recBar.querySelector('i')
    function setProg(frac) { recBar.classList.remove('indet'); recFill.style.width = (Math.max(0, Math.min(1, frac)) * 100) + '%' }
    let exportRenderer = null, exportCamera = null, compositor = null, compCtx = null

    function ensureExport() {
      if (exportRenderer) return
      exportRenderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
      exportRenderer.setPixelRatio(1)
      exportRenderer.setSize(EXPORT_SIZE, EXPORT_SIZE, false)
      exportRenderer.outputColorSpace = THREE.SRGBColorSpace
      exportCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 8000)
      // a 2D compositor is the on-screen, captured surface: it boosts contrast on the flat (scannable) frames
      // so coarse level-M codes still decode, while the 3D orbit stays natural. captureStream reads it.
      compositor = document.createElement('canvas'); compositor.width = EXPORT_SIZE; compositor.height = EXPORT_SIZE + FOOTER_H
      compCtx = compositor.getContext('2d')
      recOverlay.insertBefore(compositor, recBar)
    }

    // embed authorship as PNG tEXt chunks (invisible, but provable) — inserted right after IHDR
    const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0 } return t })()
    function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0 }
    function textChunk(keyword, text) {
      const body = []
      for (let i = 0; i < keyword.length; i++) body.push(keyword.charCodeAt(i) & 0xFF)
      body.push(0)
      for (let i = 0; i < text.length; i++) body.push(text.charCodeAt(i) & 0xFF)
      const type = [116, 69, 88, 116] // 'tEXt'
      const typed = new Uint8Array(type.concat(body))      // crc covers type + data
      const out = new Uint8Array(12 + body.length)
      const dv = new DataView(out.buffer)
      dv.setUint32(0, body.length); out.set(type, 4); out.set(body, 8); dv.setUint32(8 + body.length, crc32(typed))
      return out
    }
    function pngWithText(dataURL, fields) {
      const bin = atob(dataURL.split(',')[1]); const png = new Uint8Array(bin.length)
      for (let i = 0; i < bin.length; i++) png[i] = bin.charCodeAt(i)
      const at = 33 // 8 sig + IHDR(4 len + 4 type + 13 data + 4 crc)
      const chunks = Object.entries(fields).map(([k, v]) => textChunk(k, v))
      const extra = chunks.reduce((n, c) => n + c.length, 0)
      const out = new Uint8Array(png.length + extra)
      out.set(png.subarray(0, at), 0)
      let off = at
      for (const c of chunks) { out.set(c, off); off += c.length }
      out.set(png.subarray(at), off)
      return new Blob([out], { type: 'image/png' })
    }

    function exportSlug() {
      let s = (input.value || DEFAULT_CONTENT).trim().replace(/^https?:\/\//i, '').replace(/^www\./i, '')
      s = s.replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '').toLowerCase()
      return s.slice(0, 40) || 'qr'
    }
    function exportTag() { return currentModel === 'pine' ? `pine-${variant}` : currentModel }
    function exportName(suffix, ext) { return `${exportTag()}-qr-${exportSlug()}${suffix}.${ext}` }
    // render one export frame (square, no HUD) into the compositor; contrast is full at flat (e=0), none in iso (e=1)
    // only the low-contrast designs need a contrast lift to stay scannable as a standalone image; the rest
    // export exactly as shown on screen. boost applies at flat (e=0) and ramps to none by iso (e=1).
    function exportBoost() {
      if (currentModel === 'pine') return variant === 'snow' ? 2.0 : 1.0 // snow + the footer logo is the worst case
      if (currentModel === 'caladium-m') return 1.5
      return 1.0 // caladium-h, pine forest — scan raw, no boost → saved == on-screen
    }
    function renderExportFrame(e, azv, kOverride) {
      ensureExport(); clearSway()
      fadeMat.opacity = fadeOpacity(e)
      applyCamera(exportCamera, e, azv, 1)
      exportRenderer.render(scene, exportCamera)
      const K = kOverride != null ? kOverride : 1 + (exportBoost() - 1) * (1 - Math.max(0, Math.min(1, e)))
      compCtx.clearRect(0, 0, compositor.width, compositor.height)
      compCtx.filter = `contrast(${Math.round(K * 100)}%)`
      compCtx.drawImage(exportRenderer.domElement, 0, 0, EXPORT_SIZE, EXPORT_SIZE) // the code (square)
      compCtx.filter = 'none'
      // footer: match it to the (boosted) quiet-zone colour so there's no seam, then drop the signature in
      const q = compCtx.getImageData(6, 6, 1, 1).data
      compCtx.fillStyle = `rgb(${q[0]},${q[1]},${q[2]})`
      compCtx.fillRect(0, EXPORT_SIZE, compositor.width, FOOTER_H)
      if (logoImg.complete && logoImg.naturalWidth) {
        const lw = EXPORT_SIZE * 0.19, lh = lw * (logoImg.naturalHeight / logoImg.naturalWidth)
        compCtx.globalAlpha = 0.72
        compCtx.drawImage(logoImg, (EXPORT_SIZE - lw) / 2, EXPORT_SIZE + (FOOTER_H - lh) / 2, lw, lh)
        compCtx.globalAlpha = 1
      }
    }

    function savePng() {
      renderExportFrame(0, 0) // flat top-down → the scannable still
      const blob = pngWithText(compositor.toDataURL('image/png'), {
        Copyright: '(c) Khoo Pyn Zhern, pynzhern.com'
      })
      const url = URL.createObjectURL(blob)
      download(url, exportName('', 'png'))
      setTimeout(() => URL.revokeObjectURL(url), 5000)
    }

    // capture timeline: hold flat → grow → hold grown → ease a full 360° spin → hold grown → flatten → hold flat.
    // the spin eases in and out of rest (no abrupt start/stop) and is bracketed by short stills, so the loop
    // breathes instead of snapping into the orbit. the longer flat holds also give the video a clear cover frame.
    // endpoints are the identical flat frame and the spin lands back at az 0 (≡ 2π), so the clip still loops
    // seamlessly with no extra un-spin on the flatten.
    const EXP = { holdA: 0.5, grow: 1.1, holdGrownIn: 0.4, orbit: 3.4, holdGrownOut: 0.4, flat: 1.1, holdB: 0.5 }
    const EXP_DUR = EXP.holdA + EXP.grow + EXP.holdGrownIn + EXP.orbit + EXP.holdGrownOut + EXP.flat + EXP.holdB
    function exportState(s) {
      if (s < EXP.holdA) return [0, 0]; s -= EXP.holdA
      if (s < EXP.grow) return [easeInOut(s / EXP.grow), 0]; s -= EXP.grow
      if (s < EXP.holdGrownIn) return [1, 0]; s -= EXP.holdGrownIn       // rest, fully grown, before the spin
      if (s < EXP.orbit) return [1, 2 * Math.PI * easeInOut(s / EXP.orbit)]; s -= EXP.orbit  // eased spin: rest → 360° → rest
      if (s < EXP.holdGrownOut) return [1, 0]; s -= EXP.holdGrownOut     // rest, fully grown, after the spin (az 2π ≡ 0)
      if (s < EXP.flat) return [easeInOut(1 - s / EXP.flat), 0]          // az = 0 here, NOT 2π → clean tilt-down, no spin
      return [0, 0]
    }
    function pickMime() {
      const c = ['video/mp4;codecs=avc1.42E01E', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4']
      for (const t of c) if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t
      return ''
    }
    const canRecord = typeof HTMLCanvasElement.prototype.captureStream === 'function' && !!window.MediaRecorder && !!pickMime()
    const mp4Item = saveMenu.querySelector('[data-act="mp4"]')
    if (!canRecord) { mp4Item.disabled = true; mp4Item.title = 'video capture is not supported in this browser' }

    function setBusy(on, label) {
      saveBtn.disabled = on; btn.disabled = on
      plantSeg.querySelectorAll('button').forEach(b => b.disabled = on)
      if (on) closeMenu()
      // recording/encoding status is shown by the progress bar, not text
    }

    function recordLoop() {
      if (!canRecord) return
      ensureExport(); clearSway()
      exporting = true; recOverlay.classList.add('on'); setBusy(true); setProg(0)
      const mime = pickMime()
      const stream = compositor.captureStream(60)
      const chunks = []
      const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 })
      rec.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data) }
      // paint the flat QR before capture begins so the video's first/cover frame is the
      // scannable code, not a stale or blank compositor frame
      renderExportFrame(0, 0)
      rec.onstop = () => {
        const blob = new Blob(chunks, { type: mime })
        const ext = mime.includes('mp4') ? 'mp4' : 'webm'
        const url = URL.createObjectURL(blob)
        download(url, exportName('-loop', ext))
        setTimeout(() => URL.revokeObjectURL(url), 5000)
        recOverlay.classList.remove('on'); exporting = false; setBusy(false)
      }
      rec.start()
      const start = performance.now()
      function step(now) {
        const s = (now - start) / 1000
        const [e, azv] = exportState(Math.min(s, EXP_DUR))
        renderExportFrame(e, azv)
        setProg(s / EXP_DUR)
        if (s < EXP_DUR) requestAnimationFrame(step)
        else rec.stop()
      }
      requestAnimationFrame(step)
    }

    // ---- GIF export: same loop, encoded client-side (loops inline everywhere a video won't) ----
    const GIF_SIZE = 480, GIF_FPS = 24 // 24 = cinematic standard: smooth to the eye, lighter than 30 to encode/download
    const GIF_H = Math.round(GIF_SIZE * (EXPORT_SIZE + FOOTER_H) / EXPORT_SIZE)
    let GIFlib = null, gifWorkerURL = null, gifScratch = null, gifScratchCtx = null
    async function ensureGifLib() {
      if (GIFlib) return
      if (!window.GIF) {
        await new Promise((res, rej) => {
          const s = document.createElement('script')
          s.src = 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js'
          s.onload = res; s.onerror = () => rej(new Error('gif.js load failed'))
          document.head.appendChild(s)
        })
      }
      GIFlib = window.GIF
      const resp = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js') // blob worker → no cross-origin worker error
      gifWorkerURL = URL.createObjectURL(await resp.blob())
    }
    async function saveGif() {
      ensureExport(); clearSway()
      exporting = true; recOverlay.classList.add('on'); setBusy(true); recBar.classList.add('indet')
      try { await ensureGifLib() }
      catch (e) { recOverlay.classList.remove('on'); exporting = false; setBusy(false); alert('could not load the gif encoder (offline?)'); return }
      if (!gifScratch) { gifScratch = document.createElement('canvas'); gifScratch.width = GIF_SIZE; gifScratch.height = GIF_H; gifScratchCtx = gifScratch.getContext('2d') }
      const gif = new GIFlib({ workers: 4, quality: 8, width: GIF_SIZE, height: GIF_H, workerScript: gifWorkerURL, repeat: 0 })
      const frames = Math.round(EXP_DUR * GIF_FPS)
      for (let i = 0; i < frames; i++) {
        const [e, azv] = exportState(Math.min(i / GIF_FPS, EXP_DUR))
        renderExportFrame(e, azv)
        gifScratchCtx.clearRect(0, 0, GIF_SIZE, GIF_H)
        gifScratchCtx.drawImage(compositor, 0, 0, GIF_SIZE, GIF_H)
        gif.addFrame(gifScratchCtx, { copy: true, delay: Math.round(1000 / GIF_FPS) })
        // yield every frame so the capture overlay repaints smoothly (matches the mp4 preview),
        // not every 4th (which looked choppy on screen even though the saved file was fine)
        setProg(0.5 * i / frames)
        await new Promise(r => requestAnimationFrame(r))
      }
      gif.on('progress', p => setProg(0.5 + 0.5 * p))
      gif.on('finished', blob => {
        download(URL.createObjectURL(blob), exportName('-loop', 'gif'))
        recOverlay.classList.remove('on'); exporting = false; setBusy(false)
      })
      gif.render()
    }

    // ---- about popover + save menu ----
    const aboutBtn = document.getElementById('aboutBtn')
    const aboutCard = document.getElementById('aboutCard')
    function closeMenu() { saveMenu.classList.remove('open'); saveBtn.setAttribute('aria-expanded', 'false') }
    saveBtn.addEventListener('click', ev => {
      ev.stopPropagation()
      const open = saveMenu.classList.toggle('open'); saveBtn.setAttribute('aria-expanded', String(open))
      aboutCard.classList.remove('open')
    })
    saveMenu.addEventListener('click', ev => {
      ev.stopPropagation()
      const b = ev.target.closest('button'); if (!b || b.disabled) return
      closeMenu()
      const act = b.dataset.act
      if (act === 'png') savePng(); else if (act === 'mp4') recordLoop(); else if (act === 'gif') saveGif()
    })
    aboutBtn.addEventListener('click', ev => {
      ev.stopPropagation()
      const open = aboutCard.classList.toggle('open'); aboutBtn.setAttribute('aria-expanded', String(open))
      closeMenu()
    })
    aboutCard.addEventListener('click', ev => ev.stopPropagation())
    document.addEventListener('click', () => { closeMenu(); aboutCard.classList.remove('open') })
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { closeMenu(); aboutCard.classList.remove('open') } })

    // small hook for embedding / testing: grab a square frame as a PNG data URL (k overrides the contrast boost)
    window.qrBotanical = { frame: (e, azv, k) => { renderExportFrame(e || 0, azv || 0, k); return compositor.toDataURL('image/png') } }

    let debounce = null
    input.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(rebuild, 250) })
    // the canvas fills the window above the bottom strip (its height is measured: two rows on narrow screens), so the
    // existing camera fit centres the plant in the room that is left. the v5 overhead framing in applyCamera is the one change.
    const dockEl = document.getElementById('dock')
    function fitView() {
      const h = dockEl.offsetHeight
      document.documentElement.style.setProperty('--strip-h', h + 'px')
      viewW = app.clientWidth; viewH = Math.max(1, app.clientHeight)
      topInset = window.innerWidth <= 720 ? Math.round(document.querySelector('.brand').getBoundingClientRect().bottom + 6) : 0
      renderer.setSize(viewW, viewH)
    }
    fitView()
    window.addEventListener('resize', fitView)
    if (window.ResizeObserver) new ResizeObserver(fitView).observe(dockEl)
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitView)

    rebuild()
    loading.classList.add('gone')
    setTimeout(() => loading.remove(), 500)
    requestAnimationFrame(frame)
  </script>
</body>
</html>
